name: Founder Fog · iOS TestFlight

# Builds the iOS app and uploads it to TestFlight.
# Needs these repository secrets (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID                  10-character Team ID (developer.apple.com → Membership)
#   APP_STORE_CONNECT_KEY_ID       App Store Connect API key ID
#   APP_STORE_CONNECT_ISSUER_ID    Issuer ID shown above the keys list
#   APP_STORE_CONNECT_API_KEY      contents of the AuthKey_XXXX.p8 file (Admin role,
#                                  so Xcode can create the distribution certificate)
# and an app in App Store Connect with bundle ID com.ahmedhaz.founderfog.

on:
  workflow_dispatch:
  push:
    branches: [main, claude/founder-fog-mobile-app-dxtzy6]
    paths:
      - 'founder-fog/**'
      - 'founder-fog-app/**'
      - '.github/workflows/founder-fog-testflight.yml'

concurrency:
  group: founder-fog-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-26
    defaults:
      run:
        working-directory: founder-fog-app
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
    steps:
      - name: Check secrets
        working-directory: .
        run: |
          missing=""
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_API_KEY; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing TestFlight secrets:$missing (see the top of this workflow file)"
            exit 1
          fi

      - uses: actions/checkout@v4

      # App Store Connect only accepts builds made with the iOS 26 SDK (Xcode 26+).
      - name: Select Xcode 26
        working-directory: .
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          [ -n "$XCODE" ] || XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then echo "::error::No Xcode 26 on this runner"; ls -d /Applications/Xcode*; exit 1; fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: founder-fog-app/package-lock.json

      - run: npm ci
      - run: npx cap sync ios

      - name: Write App Store Connect API key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_API_KEY" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"

      - name: Archive
        working-directory: founder-fog-app/ios/App
        run: |
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Upload to TestFlight
        working-directory: founder-fog-app/ios/App
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "### Uploaded Founder Fog build ${{ github.run_number }} to TestFlight" >> "$GITHUB_STEP_SUMMARY"
          echo "It appears in App Store Connect → TestFlight after Apple finishes processing (usually 5–30 min)." >> "$GITHUB_STEP_SUMMARY"
