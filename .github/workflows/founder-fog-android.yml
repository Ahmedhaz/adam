name: Founder Fog · Android APK

on:
  push:
    paths:
      - 'founder-fog/**'
      - 'founder-fog-app/**'
      - '.github/workflows/founder-fog-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: founder-fog-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: founder-fog-app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npx cap sync android

      - name: Build debug APK
        working-directory: founder-fog-app/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: founder-fog-apk
          path: founder-fog-app/android/app/build/outputs/apk/debug/app-debug.apk
